services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: health-agent-postgres

    environment:
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health
      POSTGRES_DB: health_agent

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U health -d health_agent"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: